<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IHC Test Business - LocalProof Widget Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .hero {
            background: white;
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #1a1a1a;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #64748b;
            font-size: 18px;
            margin-bottom: 20px;
        }
        .info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .info-item {
            padding: 15px;
            background: #f8fafc;
            border-radius: 8px;
        }
        .info-label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .info-value {
            font-size: 16px;
            color: #1a1a1a;
            font-weight: 500;
        }
        .widget-section {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .widget-title {
            font-size: 14px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }
        .powered-by {
            text-align: center;
            margin-top: 30px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }
        .powered-by a {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero">
            <h1>IHC Test Business</h1>
            <p class="subtitle">Your Local Retail Destination in Austin, TX</p>
            <div class="info">
                <div class="info-item">
                    <div class="info-label">Address</div>
                    <div class="info-value">123 Main St, Austin, TX 78701</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Category</div>
                    <div class="info-value">Retail Store</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Hours</div>
                    <div class="info-value">Mon-Sat 9AM-8PM</div>
                </div>
            </div>
        </div>

        <div class="widget-section">
            <div class="widget-title">Verified Customer Visits</div>

            <!-- LocalProof Widget Embed -->
            <div id="localproof-widget"></div>
            <script src="https://localproof-api.onrender.com/api/widget/02c44a40-2ada-4433-8b97-625cd5c4dd5d/embed.js"></script>
        </div>

        <p class="powered-by">
            GPS-verified check-ins powered by <a href="https://localproof.app">LocalProof</a>
        </p>
    </div>
</body>
</html>
